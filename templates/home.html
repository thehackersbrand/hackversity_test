{% extends 'base.html' %}

{% block title %}Hackversity - Home{% endblock %}

{% block content %}
<div class="main-content">
    <section class="hero">
        <h1><span class="typed-text"></span><span class="cursor">&nbsp;</span></h1>
        
        <div class="input-section">
            <div class="input-container">
                <input type="text" id="user-input" placeholder="Type your question..." class="custom-input">
                <button id="submit-btn" class="submit-button">
                    <i class="fas fa-paper-plane"></i>
                    Submit
                </button>
            </div>
            <div id="response-area" class="response-container">
                <!-- Gemini responses will appear here -->
            </div>
        </div>
    </section>
</div>
{% endblock %}
