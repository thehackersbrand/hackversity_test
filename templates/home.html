{% extends 'base.html' %}

{% block title %}Hackversity - Home{% endblock %}

{% block content %}
<div class="main-content">
    <section class="hero">
        <h1><span class="typed-text"></span><span class="cursor">&nbsp;</span></h1>
        
        <div class="search-container">
            <div class="search-box">
                <input type="text" placeholder="Ask anything or @mention a Space" class="search-input">
                <div class="search-actions">
                    <button class="search-icon"><i class="fas fa-search"></i></button>
                    <button class="action-button"><i class="fas fa-random"></i></button>
                    <button class="action-button"><i class="fas fa-lightbulb"></i></button>
                    <div class="right-actions">
                        <button class="action-button"><i class="fas fa-globe"></i></button>
                        <button class="action-button"><i class="fas fa-th"></i></button>
                        <button class="action-button"><i class="fas fa-link"></i></button>
                        <button class="action-button"><i class="fas fa-microphone"></i></button>
                        <button class="action-button ai-button"><i class="fas fa-robot"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    

   
</div>
{% endblock %}
